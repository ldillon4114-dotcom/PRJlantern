<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lantern">
<meta name="theme-color" content="#020503">
<title>LANTERN</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#020503;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none;}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;}
  canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;}
  #lantern{position:relative;width:min(62vw,300px);z-index:3;}
  #glow{position:absolute;inset:-60%;border-radius:50%;pointer-events:none;opacity:.25;
    background:radial-gradient(circle, rgba(0,255,140,.7), rgba(0,255,140,0) 70%);}
  svg{display:block;width:100%;height:auto;position:relative;z-index:1;}
  #status{position:relative;z-index:4;color:#bfffd9;letter-spacing:.42em;font-size:14px;
    text-transform:uppercase;text-shadow:0 0 14px rgba(0,255,140,.55);padding-left:.42em;}
  #pct{position:relative;z-index:4;color:rgba(190,255,220,.75);font-size:26px;font-weight:200;
    letter-spacing:.18em;height:32px;font-variant-numeric:tabular-nums;}
  #hint{position:relative;z-index:4;color:rgba(150,220,180,.4);font-size:11px;letter-spacing:.3em;
    text-transform:uppercase;min-height:14px;}
  body.charged #status{color:#eafff2;text-shadow:0 0 18px rgba(0,255,140,.9);}
  #flash{position:fixed;inset:0;background:radial-gradient(circle,#ffffff,#d6ffe6 40%,#7dffb8 70%,#0aff66);
    opacity:0;pointer-events:none;z-index:9;transition:opacity 1.6s ease-out;}
  .spin{transform-origin:150px 212px;animation:rot 26s linear infinite;}
  .spinR{transform-origin:150px 212px;animation:rotR 40s linear infinite;}
  @keyframes rot{to{transform:rotate(360deg);}}
  @keyframes rotR{to{transform:rotate(-360deg);}}
  .pulse{animation:pl 2.6s ease-in-out infinite;}
  @keyframes pl{0%,100%{opacity:.35;}50%{opacity:.9;}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="fx"></canvas>
  <div id="lantern">
    <div id="glow"></div>
    <svg viewBox="0 0 300 430" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0c1f16"/><stop offset=".28" stop-color="#2e4a3a"/>
          <stop offset=".5" stop-color="#0a1810"/><stop offset=".74" stop-color="#274434"/>
          <stop offset="1" stop-color="#0c1f16"/>
        </linearGradient>
        <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="rgba(120,255,180,.10)"/><stop offset="1" stop-color="rgba(0,40,20,.35)"/>
        </linearGradient>
        <radialGradient id="coreg" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#eaffee"/><stop offset=".35" stop-color="#5cff9d"/>
          <stop offset=".75" stop-color="#0abf55"/><stop offset="1" stop-color="rgba(0,120,50,0)"/>
        </radialGradient>
        <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>

      <g class="spin" opacity=".5">
        <circle cx="150" cy="212" r="118" fill="none" stroke="#1f6f45" stroke-width="1" stroke-dasharray="3 9"/>
        <circle cx="150" cy="212" r="132" fill="none" stroke="#134d31" stroke-width="1" stroke-dasharray="18 26"/>
      </g>
      <g class="spinR" opacity=".4">
        <circle cx="150" cy="212" r="106" fill="none" stroke="#1a5c3a" stroke-width="1.5" stroke-dasharray="40 60"/>
      </g>

      <circle cx="150" cy="26" r="9" fill="none" stroke="url(#metal)" stroke-width="6"/>
      <rect x="118" y="38" width="64" height="16" rx="7" fill="url(#metal)"/>
      <path d="M96 54 L204 54 L186 100 L114 100 Z" fill="url(#metal)" stroke="#3f6d54" stroke-width="1"/>
      <rect x="112" y="62" width="76" height="4" rx="2" fill="#0aff66" opacity=".28" class="pulse"/>

      <path d="M84 170 L60 200 L84 226 Z" fill="url(#metal)"/>
      <path d="M216 170 L240 200 L216 226 Z" fill="url(#metal)"/>

      <path d="M110 100 C110 148 78 168 78 218 C78 296 118 330 150 330 C182 330 222 296 222 218 C222 168 190 148 190 100 Z"
            fill="url(#glass)" stroke="#2f5b44" stroke-width="2"/>
      <path d="M96 250 C120 268 180 268 204 250" fill="none" stroke="#0e7a41" stroke-width="2" opacity=".5" class="pulse"/>
      <path d="M100 196 C126 180 174 180 200 196" fill="none" stroke="#0e7a41" stroke-width="2" opacity=".4" class="pulse"/>

      <circle cx="150" cy="216" r="64" fill="url(#coreg)" opacity=".55" filter="url(#blur8)"/>
      <circle id="core" cx="150" cy="216" r="40" fill="url(#coreg)"/>

      <g id="logo">
        <circle cx="150" cy="216" r="62" fill="none" stroke="#d9ffe9" stroke-width="4.5" opacity=".92"/>
        <circle cx="150" cy="216" r="68" fill="none" stroke="rgba(0,255,140,.35)" stroke-width="1.5"/>
        <path d="M126 194 L174 194 L166 206 L134 206 Z" fill="#eafff2"/>
        <path d="M136 210 C136 232 124 240 124 252 L176 252 C176 240 164 232 164 210 Z" fill="#eafff2"/>
        <rect x="143" y="256" width="14" height="8" rx="2" fill="#eafff2"/>
      </g>

      <ellipse cx="150" cy="336" rx="88" ry="16" fill="url(#metal)"/>
      <path d="M96 336 L204 336 L192 366 L108 366 Z" fill="url(#metal)" stroke="#3f6d54" stroke-width="1"/>
      <g fill="#2fe08a" opacity=".8">
        <rect x="112" y="344" width="3" height="12"/><rect x="120" y="347" width="3" height="6"/>
        <rect x="130" y="344" width="3" height="12"/><rect x="140" y="347" width="3" height="6"/>
        <rect x="150" y="344" width="3" height="12"/><rect x="160" y="347" width="3" height="6"/>
        <rect x="170" y="344" width="3" height="12"/><rect x="180" y="347" width="3" height="6"/>
      </g>
      <ellipse cx="150" cy="374" rx="60" ry="10" fill="url(#metal)"/>
      <ellipse cx="150" cy="380" rx="40" ry="8" fill="#0aff66" opacity=".2" class="pulse"/>
    </svg>
  </div>
  <div id="status">TAP TO CHARGE</div>
  <div id="pct"></div>
  <div id="hint">in brightest day, in blackest night</div>
  <div id="flash"></div>
</div>
<script>
var DUR=20000, HOLD=2600, DRAIN=8000;
var phase='idle', t0=0, drainT0=0, lastBeep=-1, thumpTO=null, crackIV=null, holdTO=null;
var statusEl=document.getElementById('status'), pctEl=document.getElementById('pct'),
    flashEl=document.getElementById('flash'), hintEl=document.getElementById('hint'),
    glowEl=document.getElementById('glow'), body=document.body;
addEventListener('error',function(e){ try{ statusEl.textContent='ERR: '+((e&&e.message)||'unknown'); }catch(_e){} });
function onTap(){ if(phase==='idle') startCharge(); }
addEventListener('pointerdown',onTap,{passive:true});
addEventListener('touchstart',onTap,{passive:true});
addEventListener('click',onTap);

var cv=document.getElementById('fx'), cx=cv.getContext('2d'), motes=[];
function size(){ var d=devicePixelRatio||1; cv.width=Math.floor(innerWidth*d); cv.height=Math.floor(innerHeight*d); cx.setTransform(d,0,0,d,0,0); }
try{ size(); }catch(e){}
addEventListener('resize',function(){ try{ size(); }catch(e){} });
for(var i=0;i<40;i++) motes.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.2,s:.15+Math.random()*.5,d:Math.random()*6.28});
function reflow(){ void body.offsetWidth; }
function pnow(){
  if(phase==='charging') return Math.min((performance.now()-t0)/DUR,1);
  if(phase==='hold') return 1;
  if(phase==='draining') return Math.max(1-(performance.now()-drainT0)/DRAIN,0);
  return .04;
}
function mix(p){
  var r=Math.round(2+118*p), g=Math.round(5+250*p), b=Math.round(3+190*p);
  var r2=Math.round(2+200*p), g2=Math.round(6+255*p), b2=Math.round(3+220*p);
  body.style.background='radial-gradient(circle at 50% 40%, rgb('+r2+','+g2+','+b2+'), rgb('+r+','+g+','+b+') 62%, rgb(1,3,2))';
}

/* ---------- audio ---------- */
var AC=null, master=null, filt=null, hum=null, hum2=null, noise=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  var A=window.AudioContext||window.webkitAudioContext; AC=new A();
  master=AC.createGain(); master.gain.value=0.0001; master.connect(AC.destination);
  filt=AC.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=200; filt.Q.value=8; filt.connect(master);
  var humG=AC.createGain(); humG.gain.value=.5; humG.connect(filt);
  hum=AC.createOscillator(); hum.type='sawtooth'; hum.frequency.value=46;
  hum2=AC.createOscillator(); hum2.type='sine'; hum2.frequency.value=93.5;
  hum.connect(humG); hum2.connect(humG); hum.start(); hum2.start();
  var len=AC.sampleRate; noise=AC.createBuffer(1,len,AC.sampleRate);
  var d=noise.getChannelData(0); for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
}
function crackle(v){
  var s=AC.createBufferSource(); s.buffer=noise;
  var f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200+Math.random()*2600; f.Q.value=8;
  var g=AC.createGain(); var t=AC.currentTime;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.08);
  s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(t+.09);
}
function beep(fq){
  var o=AC.createOscillator(); o.type='sine'; o.frequency.value=fq;
  var g=AC.createGain(); var t=AC.currentTime;
  g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.13,t+.02);
  g.gain.exponentialRampToValueAtTime(.0001,t+.4);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(t+.45);
}
function thump(v){
  var t=AC.currentTime;
  var o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(64,t);
  o.frequency.exponentialRampToValueAtTime(30,t+.28);
  var g=AC.createGain(); g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(v,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+.34);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(t+.4);
}
function tink(v){
  var o=AC.createOscillator(); o.type='sine'; o.frequency.value=2000+Math.random()*2400;
  var g=AC.createGain(); var t=AC.currentTime;
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+.14);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(t+.16);
}
function surge(){
  var t=AC.currentTime, notes=[261.6,329.6,392,523.3];
  for(var i=0;i<notes.length;i++){
    var o=AC.createOscillator(); o.type='sine'; o.frequency.value=notes[i];
    var g=AC.createGain(); g.gain.setValueAtTime(.0001,t+i*.1);
    g.gain.linearRampToValueAtTime(.14,t+i*.1+.2);
    g.gain.exponentialRampToValueAtTime(.0001,t+2.4);
    o.connect(g); g.connect(AC.destination); o.start(t+i*.1); o.stop(t+2.5);
  }
}
function whoosh(){
  var t=AC.currentTime;
  var s=AC.createBufferSource(); s.buffer=noise; s.loop=true;
  var f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(3200,t);
  f.frequency.exponentialRampToValueAtTime(70,t+7.6);
  var g=AC.createGain(); g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.0001,t+7.7);
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); s.stop(t+8);
}
function thumpChain(gap){
  if(phase!=='charging') return;
  try{ thump(.12+.2*pnow()); }catch(e){}
  gap=Math.max(gap*.88,150);
  thumpTO=setTimeout(function(){ thumpChain(gap); },gap);
}

/* ---------- charge / hold / drain ---------- */
function startCharge(){
  if(phase!=='idle') return;
  phase='charging'; t0=performance.now(); lastBeep=-1;
  body.classList.remove('charged'); reflow();
  flashEl.style.opacity=0;
  statusEl.textContent='CHARGING'; hintEl.textContent='charging the ring, sir';
  try{
    initAudio();
    var t=AC.currentTime;
    master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(.03,t);
    hum.frequency.setValueAtTime(46,t); hum2.frequency.setValueAtTime(93.5,t);
    thumpChain(1150);
    crackIV=setInterval(function(){ if(phase==='charging'&&Math.random()<.25){ try{ crackle(.03+.08*Math.random()); }catch(e){} } },320);
  }catch(e){}
  kick();
}
function endCharge(){
  if(phase!=='charging') return;
  phase='hold';
  clearTimeout(thumpTO); clearInterval(crackIV);
  body.classList.add('charged'); reflow();
  flashEl.style.opacity=1; setTimeout(function(){ flashEl.style.opacity=0; },140);
  pctEl.textContent='100%';
  statusEl.textContent='RING CHARGED'; hintEl.textContent='energy at peak';
  try{ surge(); }catch(e){}
  holdTO=setTimeout(startDrain,HOLD);
  kick();
}
function startDrain(){
  if(phase!=='hold') return;
  phase='draining'; drainT0=performance.now();
  statusEl.textContent='DISCHARGING'; hintEl.textContent='power returning to the dark';
  try{ whoosh(); }catch(e){}
  kick();
}
function finishDrain(){
  if(phase!=='draining') return;
  phase='idle';
  clearTimeout(holdTO);
  body.classList.remove('charged'); reflow();
  statusEl.textContent='TAP TO CHARGE'; hintEl.textContent='in brightest day, in blackest night';
  pctEl.textContent='';
  if(AC){ try{ var t=AC.currentTime; master.gain.cancelScheduledValues(t); master.gain.value=.0001;
    hum.frequency.setValueAtTime(46,t); hum2.frequency.setValueAtTime(93.5,t); }catch(e){} }
}

/* ---------- render loop ---------- */
var running=false;
function kick(){ if(!running){ running=true; requestAnimationFrame(frame); } }
function frame(){
  if(phase==='idle'){ running=false; body.style.background=''; return; }
  var p=pnow(), e=performance.now()-t0, now=performance.now();
  mix(p);
  glowEl.style.opacity=(.25+.75*p);
  if(phase==='charging'){
    var bi=Math.floor(e/2000);
    if(bi>lastBeep){ lastBeep=bi; try{ beep(340+55*bi); }catch(er){} }
    if(AC){ try{
      master.gain.value=.03+.3*p;
      filt.frequency.value=200+1900*p*p;
      hum.frequency.value=46*(1+1.6*p); hum2.frequency.value=93.5*(1+1.6*p);
    }catch(er){} }
    if(e>=DUR){ endCharge(); }
  } else if(phase==='draining'){
    if(AC){ try{
      var dp=pnow();
      master.gain.value=Math.max(.2*(1-(now-drainT0)/DRAIN),.0001);
      hum.frequency.value=74-(74-30)*(1-dp); hum2.frequency.value=150-(150-60)*(1-dp);
    }catch(er){} }
    if(now-drainT0>=DRAIN){ finishDrain(); }
  }
  pctEl.textContent=phase==='hold'?'100%':Math.round(p*100)+'%';
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=0;i<motes.length;i++){
    var m=motes[i]; m.y-=m.s*.004+.0004; if(m.y<-.05){m.y=1.05;m.x=Math.random();}
    var a=(.2+.8*p)*(.4+.6*Math.abs(Math.sin(m.d+now*.002)));
    cx.beginPath(); cx.arc(m.x*innerWidth,m.y*innerHeight,m.r,0,6.28);
    cx.fillStyle='rgba(120,255,180,'+a*.5+')'; cx.fill();
  }
  var n=Math.floor(2+5*p);
  for(var j=0;j<n;j++){
    var an=now*.0004+j*(6.28/Math.max(n,1));
    var rr=innerWidth*.5*(.55+.3*Math.sin(an*2.3));
    cx.beginPath(); cx.arc(innerWidth/2+rr*Math.cos(an),innerHeight*.47+rr*.62*Math.sin(an),1.6+3*p,0,6.28);
    cx.fillStyle='rgba(140,255,200,'+(.3+.6*p)+')'; cx.fill();
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
